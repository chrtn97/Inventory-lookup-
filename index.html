<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANPASA Inventarios</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

h1{
    text-align:center;
}

select,input{
    padding:10px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

th{
    background:#f0f0f0;
}

.cantidad{
    width:80px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>ANPASA INVENTARIOS</h1>

<select id="linea" onchange="cargarLinea()">
    <option value="colgante">COLGANTE</option>
    <option value="tubular">TUBULAR</option>
    <option value="multidireccional">MULTIDIRECCIONAL</option>
    <option value="pararrayos">PARARRAYOS</option>
</select>

<input type="text" id="buscar" placeholder="Buscar..." onkeyup="filtrar()">

<button onclick="limpiarTodo()">Limpiar Inventario</button>

<br><br>

<table>
<thead>
<tr>
<th>Código</th>
<th>Descripción</th>
<th>Cantidad</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script>

const catalogos = {

colgante: [
{codigo:"PLATM-200",descripcion:"PLATAFORMA METALICA 2.00 MT"},
{codigo:"PLATM-250",descripcion:"PLATAFORMA METALICA 2.50 MT"},
{codigo:"PASM-200",descripcion:"PASAMANOS METALICO 2.00 MT"},
{codigo:"TIR-2000",descripcion:"TIRFOR ET-2000"}
],

tubular: [
{codigo:"B-10",descripcion:"BASE TUBULAR"},
{codigo:"M-152",descripcion:"MARCO"},
{codigo:"P-213",descripcion:"PLATAFORMA"},
{codigo:"TA-40",descripcion:"TORNILLO DE AJUSTE"}
],

multidireccional: [
{codigo:"2603.100",descripcion:"POSTE VERTICAL 100"},
{codigo:"2601.157",descripcion:"SOPORTE HORIZONTAL 157"},
{codigo:"4001.060",descripcion:"TORNILLO BASE 60"},
{codigo:"4702.022",descripcion:"GRAPA GIRATORIA"}
],

pararrayos: [
{codigo:"A30",descripcion:"CABLE DE ALUMINIO"},
{codigo:"C121A",descripcion:"ABRAZADERA PARA CABLE"},
{codigo:"RPM6",descripcion:"KIT RETENIDA MASTIL"},
{codigo:"KELYNC-L",descripcion:"KIT ELECTRODO QUIMICO"}
]

};

function cargarLinea(){

const linea=document.getElementById("linea").value;
const tabla=document.getElementById("tabla");

tabla.innerHTML="";

catalogos[linea].forEach(item=>{

const key=linea+"_"+item.codigo;
const valor=localStorage.getItem(key)||"";

tabla.innerHTML+=`
<tr>
<td>${item.codigo}</td>
<td>${item.descripcion}</td>
<td>
<input
class="cantidad"
type="number"
value="${valor}"
oninput="guardar('${key}',this.value)"
>
</td>
</tr>
`;

});

}

function guardar(key,valor){
localStorage.setItem(key,valor);
}

function filtrar(){

const texto=document.getElementById("buscar").value.toLowerCase();

document.querySelectorAll("#tabla tr").forEach(fila=>{

fila.style.display=
fila.innerText.toLowerCase().includes(texto)
? ""
: "none";

});

}

function limpiarTodo(){

if(confirm("¿Eliminar capturas de esta línea?")){

const linea=document.getElementById("linea").value;

catalogos[linea].forEach(item=>{
localStorage.removeItem(linea+"_"+item.codigo);
});

cargarLinea();

}

}

cargarLinea();

</script>

</body>
</html>
``
