<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteo de Inventario</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:15px;
    margin:0;
}
h1{
    text-align:center;
}
.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
    margin-bottom:15px;
}
input{
    width:100%;
    padding:12px;
    margin:5px 0;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}
button{
    border:none;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
}
.btn-agregar{
    width:100%;
    background:#1976d2;
}
.btn-editar{
    background:#f39c12;
}
.btn-eliminar{
    background:#e74c3c;
}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
}
th, td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{
    background:#1976d2;
    color:white;
}
.total{
    text-align:center;
    margin-bottom:10px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Conteo de Inventario</h1>

<div class="card">

    <input type="text" id="articulo" placeholder="No. Artículo">

    <input type="text" id="nombre" placeholder="Nombre del artículo">

    <input type="number" id="cantidad" placeholder="Cantidad (+ o -)">

    <button class="btn-agregar" onclick="registrar()">
        Registrar Movimiento
    </button>

</div>

<div class="total">
    Total de piezas: <span id="total">0</span>
</div>

<table>
    <thead>
        <tr>
            <th>Artículo</th>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla"></tbody>
</table>

<script>

let inventario =
JSON.parse(localStorage.getItem("inventario")) || [];

function guardar() {
    localStorage.setItem(
        "inventario",
        JSON.stringify(inventario)
    );
}

function registrar() {

    let articulo =
    document.getElementById("articulo").value.trim();

    let nombre =
    document.getElementById("nombre").value.trim();

    let cantidad =
    Number(document.getElementById("cantidad").value);

    if(
        articulo === "" ||
        nombre === "" ||
        isNaN(cantidad)
    ){
        alert("Completa todos los campos");
        return;
    }

    let existe =
    inventario.find(
        item => item.articulo === articulo
    );

    if(existe){
        existe.cantidad += cantidad;
    }else{
        inventario.push({
            articulo: articulo,
            nombre: nombre,
            cantidad: cantidad
        });
    }

    guardar();
    mostrar();

    document.getElementById("articulo").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("cantidad").value = "";
}

function editar(indice){

    let nuevaCantidad = prompt(
        "Nueva cantidad:",
        inventario[indice].cantidad
    );

    if(nuevaCantidad === null) return;

    inventario[indice].cantidad =
    Number(nuevaCantidad);

    guardar();
    mostrar();
}

function eliminar(indice){

    if(confirm("¿Eliminar artículo?")){

        inventario.splice(indice,1);

        guardar();
        mostrar();
    }
}
